worker_processes auto;

# =========================================================================
# Level 1 (Lightweight / Dev):
# worker_rlimit_nofile 10000;
# -------------------------------------------------------------------------
# Level 2 (Production Recommended - ACTIVE NOW):
worker_rlimit_nofile 65535;
# -------------------------------------------------------------------------
# Level 3 (High Scale Pro - 25k Creators):
# worker_rlimit_nofile 100000;
# -------------------------------------------------------------------------
# Level 4 (GOD MODE 🔥 - 100k+ Creators):
# worker_rlimit_nofile 200000;
# =========================================================================

events {
    # =========================================================================
    # Level 1: worker_connections 4096;
    # Level 2 (Production Recommended - ACTIVE NOW): worker_connections 20480;
    # Level 3: worker_connections 40960;
    # Level 4 (GOD MODE 🔥): worker_connections 65535;
    # =========================================================================
    worker_connections 20480;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Embedded Docker DNS Resolver for dynamic container resolution
    resolver 127.0.0.11 valid=10s ipv6=off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    client_max_body_size 50M;

    upstream web_backend {
        server web:8005;
        # Level 1: keepalive 256;
        # Level 2 (ACTIVE NOW): keepalive 1024;
        # Level 3: keepalive 2048;
        # Level 4 (GOD MODE 🔥): keepalive 4096;
        keepalive 1024;
    }

    upstream webhook_backend {
        server webhook:8006;
        # Level 1: keepalive 256;
        # Level 2 (ACTIVE NOW): keepalive 1024;
        # Level 3: keepalive 2048;
        # Level 4 (GOD MODE 🔥): keepalive 4096;
        keepalive 1024;
    }

    # Main API (api.locanydm.online -> web:8005)
    server {
        listen 80 default_server;
        server_name api.locanydm.online localhost "";

        location / {
            proxy_pass http://web_backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }

    # Dedicated Webhook Route (wb.locanydm.online -> webhook:8006)
    server {
        listen 80;
        server_name wb.locanydm.online;

        location / {
            proxy_pass http://webhook_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 90;
            proxy_connect_timeout 90;
        }
    }
}